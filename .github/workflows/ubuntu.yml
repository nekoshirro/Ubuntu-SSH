name: Ubuntu

on:
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: 'Max session duration in minutes (GitHub free public repo hard cap ~360)'
        required: false
        default: '350'

defaults:
  run:
    shell: bash

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install tools & configure the 'runner' account
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache \
            /usr/share/swift \
            /usr/local/share/powershell 2>/dev/null || true

          sudo docker image prune --all --force 2>/dev/null || true
          sudo docker system prune --all --force --volumes 2>/dev/null || true

          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile /mnt/swapfile 2>/dev/null || true
          sudo fallocate -l 20G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=20480 2>/dev/null
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          sudo apt-get update -y

          sudo apt-get install -y --no-install-recommends \
            openssh-server \
            tmux \
            landscape-common \
            git \
            curl \
            make \
            nano \
            unzip \
            bc \
            bison \
            build-essential \
            cmake \
            flex \
            libelf-dev \
            libssl-dev \
            lld \
            ninja-build \
            texinfo \
            xz-utils \
            zlib1g-dev

          sudo apt-get clean
          sudo apt-get autoremove -y

          tmux -V
          git --version
          curl --version | head -1
          make --version | head -1
          nano --version | head -1

          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc > /dev/null

          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list

          sudo apt-get update -y
          sudo apt-get install -y ngrok

          ngrok config add-authtoken "${{ secrets.NGROK_AUTHTOKEN }}"

          PASSWORD=$(openssl rand -base64 9)
          echo "runner:${PASSWORD}" | sudo chpasswd
          echo "SSH_PASSWORD=${PASSWORD}" >> "$GITHUB_ENV"

          cat > /home/runner/.tmux.conf <<'EOF'
          set -g mouse on
          set -g history-limit 50000
          set -g default-terminal "xterm-256color"
          set -s set-clipboard on
          set -as terminal-features ',xterm*:clipboard'
          bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
          bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear 2>/dev/null || true
          EOF

          chown runner:runner /home/runner/.tmux.conf
          chmod 644 /home/runner/.tmux.conf
          sudo cp /home/runner/.tmux.conf /etc/tmux.conf

          cat > /home/runner/.bash_profile <<'EOF'
          if [ -f ~/.bashrc ]; then
              . ~/.bashrc
          fi

          if [[ $- == *i* ]] && [ -t 0 ] && [ -z "$TMUX" ]; then
              tmux new-session -A -s main
              if ! tmux has-session -t main 2>/dev/null; then
                  touch /tmp/stop
                  exit 0
              else
                  echo "[Notice] Detached from tmux session 'main'."
                  echo "Run 'tmux attach -t main' to re-enter, or 'exit' to terminate runner."
              fi
          fi
          EOF

          cat > /home/runner/.bashrc <<'EOF'
          : "${TERM:=xterm-256color}"
          export TERM
          export PS1="\[\033[01;32m\]\u@\h\[\033[00m\]:\[\033[01;34m\]\w\[\033[00m\]\$ "

          if [ -n "$TMUX" ] && [ -z "$TMUX_MOTD_SHOWN" ]; then
              export TMUX_MOTD_SHOWN=1
              if [ -s /run/motd.dynamic ] && grep -q "System information" /run/motd.dynamic 2>/dev/null; then
                  cat /run/motd.dynamic
              else
                  [ -x /etc/update-motd.d/00-header ] && /etc/update-motd.d/00-header 2>/dev/null || echo "Welcome to $(lsb_release -ds 2>/dev/null || echo Ubuntu) ($(uname -r) $(uname -m))"
                  [ -x /etc/update-motd.d/10-help-text ] && /etc/update-motd.d/10-help-text 2>/dev/null
                  echo ""
                  if command -v landscape-sysinfo >/dev/null 2>&1; then
                      landscape-sysinfo 2>/dev/null
                  else
                      echo "  System load:  $(awk '{print $1}' /proc/loadavg 2>/dev/null)"
                      echo "  Usage of /:   $(df -h / | awk 'NR==2 {print $5 " of " $2}')"
                      echo "  Memory usage: $(free -m | awk 'NR==2 {printf "%.0f%%", $3*100/$2}')"
                      echo "  Swap usage:   $(free -m | awk 'NR==3 {printf "%.0f%%", ($2>0 ? $3*100/$2 : 0)}')"
                  fi
                  echo ""
              fi
          fi
          EOF

          chown runner:runner \
            /home/runner/.bash_profile \
            /home/runner/.bashrc

          chmod 644 \
            /home/runner/.bash_profile \
            /home/runner/.bashrc

          git config --global user.name "Hafidz Muzakky"
          git config --global user.email "ais.muzakky@gmail.com"
          git config --global credential.helper store

          if [ -n "${{ secrets.GH_PAT }}" ]; then
            echo "https://${{ secrets.GH_PAT }}:x-oauth-basic@github.com" \
              > /home/runner/.git-credentials
            chmod 600 /home/runner/.git-credentials
            chown runner:runner /home/runner/.git-credentials
            echo "git-credential-store seeded from GH_PAT."
            echo "HTTPS Git pushes will not ask for a token."
          else
            echo "NOTE: no GH_PAT secret found."
            echo "Git may ask for credentials on the first HTTPS push."
          fi

          cat > /home/runner/.bash_logout <<'EOF'
          if ! tmux has-session -t main 2>/dev/null; then
              touch /tmp/stop
          fi
          EOF

          chown runner:runner /home/runner/.bash_logout
          chmod 644 /home/runner/.bash_logout

          echo "=================================================="
          echo "Shell configuration:"
          echo "  ~/.bash_profile -> auto-launch tmux session 'main'"
          echo "  ~/.tmux.conf    -> mouse mode on, 50k scrollback"
          echo "  ~/.bashrc       -> TERM + colored PS1"
          echo "=================================================="

      - name: Configure & verify sshd
        run: |
          sudo mkdir -p /var/run/sshd

          {
            echo "PasswordAuthentication yes"
            echo "PermitRootLogin no"
            echo "ClientAliveInterval 30"
            echo "ClientAliveCountMax 10"
          } | sudo tee /etc/ssh/sshd_config.d/00-runner.conf > /dev/null

          sudo service ssh restart

          echo "=================================================="
          echo "SSH service status"
          echo "=================================================="

          sudo systemctl status ssh --no-pager || true

          echo "=================================================="
          echo "Listening sockets"
          echo "=================================================="

          ss -tlnp | grep ':22' \
            || echo "sshd is NOT listening on port 22!"

          echo "=================================================="
          echo "Loopback connection test"
          echo "=================================================="

          timeout 5 bash -c '</dev/tcp/127.0.0.1/22' \
            && echo "OK: local port 22 accepts connections" \
            || echo "FAILED: local port 22 refused/timed out"

          echo "=================================================="
          echo "Effective SSH configuration"
          echo "=================================================="

          sudo sshd -T | grep -i passwordauthentication

      - name: Open tunnels, check latency, keep session alive
        run: |
          set +e
          set +o pipefail

          echo "=================================================="
          echo "SSH LOGIN INFORMATION"
          echo "=================================================="
          echo "User    : runner"
          echo "Password: ${SSH_PASSWORD}"
          echo "=================================================="

          nohup ngrok tcp 22 \
            --region ap \
            --log stdout \
            > /tmp/ngrok.log 2>&1 &

          NGROK_ADDR=""

          for i in $(seq 1 15); do
            sleep 2

            NGROK_ADDR=$(
              curl -s http://127.0.0.1:4040/api/tunnels \
              | grep -o '"public_url":"tcp://[^"]*' \
              | cut -d'/' -f3
            )

            [ -n "$NGROK_ADDR" ] && break
          done

          if [ -n "$NGROK_ADDR" ]; then
            NGROK_HOST=$(echo "$NGROK_ADDR" | cut -d: -f1)
            NGROK_PORT=$(echo "$NGROK_ADDR" | cut -d: -f2)

            echo "[1/3] ngrok OK"
            echo "      ssh runner@${NGROK_HOST} -p ${NGROK_PORT}"
            echo ""
            echo "      ngrok endpoint:"
            echo "      ${NGROK_ADDR}"
          else
            echo "[1/3] ngrok FAILED"
            echo "      Possible quota/authentication problem."
            tail -n 30 /tmp/ngrok.log
          fi

          SERVEO_ALIAS="hafidz${RANDOM}${RANDOM}"

          nohup ssh \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -R ${SERVEO_ALIAS}:22:localhost:22 \
            serveo.net \
            > /tmp/serveo.log 2>&1 &

          SERVEO_OK=""

          for i in $(seq 1 15); do
            sleep 2

            SERVEO_OK=$(
              grep -E \
                'Forwarding (SSH traffic|TCP connections) from' \
                /tmp/serveo.log \
              | head -1
            )

            [ -n "$SERVEO_OK" ] && break
          done

          if [ -n "$SERVEO_OK" ]; then
            echo "[2/3] serveo OK"
            echo "      ssh -J serveo.net runner@${SERVEO_ALIAS}"
          else
            echo "[2/3] serveo FAILED"
            echo "      Free community server may be unavailable."
            tail -n 30 /tmp/serveo.log
          fi

          nohup ssh \
            -p 443 \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -R0:localhost:22 \
            tcp@free.pinggy.io \
            > /tmp/pinggy.log 2>&1 &

          PINGGY_ADDR=""

          for i in $(seq 1 15); do
            sleep 2

            PINGGY_ADDR=$(
              grep -oE \
                'tcp://[a-zA-Z0-9.-]+\.pinggy(-free)?\.(link|online):[0-9]+' \
                /tmp/pinggy.log \
              | head -1
            )

            [ -n "$PINGGY_ADDR" ] && break
          done

          if [ -n "$PINGGY_ADDR" ]; then
            PINGGY_HOSTPORT=${PINGGY_ADDR#tcp://}
            PINGGY_HOST=$(echo "$PINGGY_HOSTPORT" | cut -d: -f1)
            PINGGY_PORT=$(echo "$PINGGY_HOSTPORT" | cut -d: -f2)

            echo "[3/3] Pinggy OK"
            echo "      ssh runner@${PINGGY_HOST} -p ${PINGGY_PORT}"
          else
            echo "[3/3] Pinggy FAILED"
            tail -n 30 /tmp/pinggy.log
          fi

          echo "=================================================="
          echo "Latency:"
          echo "IMPORTANT: measured FROM GitHub runner."
          echo "=================================================="

          for entry in \
            "ngrok:${NGROK_HOST:-}:${NGROK_PORT:-}" \
            "pinggy:${PINGGY_HOST:-}:${PINGGY_PORT:-}"
          do
            name=${entry%%:*}
            rest=${entry#*:}
            host=${rest%%:*}
            port=${rest##*:}

            if [ -n "$host" ] && [ -n "$port" ]; then
              t0=$(date +%s%N)

              timeout 3 \
                bash -c "</dev/tcp/${host}/${port}" \
                2>/dev/null

              rc=$?
              t1=$(date +%s%N)

              if [ "$rc" -eq 0 ]; then
                echo "  ${name}: $(( (t1 - t0) / 1000000 )) ms"
              else
                echo "  ${name}: connection failed"
              fi
            fi
          done

          echo "  serveo: skipped (jump-host mode)"

          echo "=================================================="
          echo ""
          echo "To measure your client latency, connect first and run:"
          echo ""
          echo "  ping <tunnel-host>"
          echo ""
          echo "=================================================="

          END=$(
            (
              SECONDS=0
              echo $((SECONDS + ${{ github.event.inputs.timeout_minutes }} * 60))
            )
          )

          HAD_SESSION=0

          echo "Session timeout:"
          echo "  ${{ github.event.inputs.timeout_minutes }} minutes"

          while [ "$SECONDS" -lt "$END" ]; do
            if [ -f /tmp/stop ]; then
              echo "stop marker found."
              echo "Session exited cleanly."
              echo "Ending workflow session."
              break
            fi

            ACTIVE=$(
              pgrep -u runner -f "sshd: runner@" \
              | wc -l \
              || true
            )

            if [ "$ACTIVE" -gt 0 ]; then
              HAD_SESSION=1
            elif [ "$HAD_SESSION" -eq 1 ] && ! sudo -u runner tmux has-session -t main 2>/dev/null; then
              echo "runner SSH session closed and tmux session ended."
              echo "Ending workflow session."
              break
            fi

            sleep 5
          done

          echo "=================================================="
          echo "session ended"
          echo "=================================================="
